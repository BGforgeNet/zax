name: ci

on:
  push:
    # Naming branches leaves tags out. A release tag runs the release workflow, which builds the same three
    # platforms itself, and the commit a tag points at ran this workflow when its branch was pushed - so the
    # unfiltered trigger only ever built every release twice.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the default leaves the job's token in .git/config where anything
          # later in the job - or an artifact made from the checkout - could carry it back out.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      # Install scripts only fetch the Electron and esbuild binaries, which the typecheck and the tests never
      # run; skipping them keeps the job to the packages it actually loads.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The trust policy in pnpm-workspace.yaml judges a version's provenance at install time; nothing there
      # re-checks published advisories, which is what this reads the lockfile against.
      - run: pnpm audit
      - run: pnpm check
      - run: pnpm lint
      # Coverage rather than a plain run: the threshold is a gate rather than a local habit, so it is
      # checked where a change has to pass rather than where it slows every run down.
      - run: pnpm test:coverage
      # The chokidar override puts svelte-check on a major its authors do not test against, and only watch mode
      # loads it - which the single-pass `pnpm check` above never enters.
      - run: pnpm verify:chokidar
      - run: ./.github/scripts/check-generated.sh

  # Separate from `verify` because it needs none of the Node install and shares nothing with it, so the two run
  # at once rather than one after the other.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the default leaves the job's token in .git/config where anything
          # later in the job - or an artifact made from the checkout - could carry it back out.
          persist-credentials: false
      - run: ./.github/scripts/lint-workflows.sh
      - run: ./.github/scripts/draft-release.test.sh
      - run: ./actions/pack-mod/scripts/pack.test.sh

  # Packaging is its own gate: the tests run the sources, and none of them would notice a file left out of the
  # archive, a path that only resolves in a checkout, or a target that stopped building on one platform. Three
  # runners because each produces a distributable only that platform can make.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the default leaves the job's token in .git/config where anything
          # later in the job - or an artifact made from the checkout - could carry it back out.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      # The Electron runtime is a 130-200 MB download per platform, and it changes only when the pin does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Unlike the verify job this one runs install scripts: esbuild's binary is what builds the shell.
      - run: pnpm install --frozen-lockfile
      # The cache stays outside the checkout: electron-builder downloads helper tools into it as CommonJS, and
      # the root package.json's `type: module` governs the whole tree, so Node would load them as ESM and fail.
      - run: pnpm --filter @zax/app package
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      # One artifact per target rather than one per platform. Every platform builds the same application two
      # ways - a directory you keep somewhere, and a single file you run - and nobody wants both: bundled, the
      # download is twice the size it needs to be and the choice is made after unpacking instead of before.
      #
      # Each path names an extension rather than wildcarding the directory, so electron-builder's own metadata
      # files stay out and a target that silently stopped producing anything fails its step instead of
      # uploading nothing. That is also why there is no catch-all step: a new target has to be named here to
      # ship, which is a line in a review rather than a file that quietly appears in someone's download.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: zax-Linux-AppImage
          path: packages/app/release/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: zax-Linux-tar.gz
          path: packages/app/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: zax-Windows-zip
          path: packages/app/release/*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: zax-Windows-exe
          path: packages/app/release/*.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: zax-macOS-zip
          path: packages/app/release/*.zip
          if-no-files-found: error
          retention-days: 7
