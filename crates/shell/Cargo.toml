[package]
name = "zax-shell"
description = "Tauri shell: window lifecycle and the command surface the interface calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jiff = "0.2.37"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "^2"
tauri-plugin-single-instance = "2.4.4"
zax-core.workspace = true
zax-fallout2.workspace = true
zax-host.workspace = true
zax-platform.workspace = true

[dev-dependencies]
serde_json = "1.0.151"
