[package]
name = "zax-preview"
description = "The domain compiled to WebAssembly, over an in-memory machine, for the browser preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` is what wasm-bindgen links; `rlib` is what the crate's own tests build against, so the
# dispatcher and the fixture are testable on the host without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zax-core.workspace = true
zax-fallout2.workspace = true
zax-platform.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.81"
wasm-bindgen = "0.2.128"
