[package]
name = "zax-host"
description = "The platform seam on a real machine: files, processes, the network and archives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dirs = "7.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
fs4 = "1.1.0"
hex = "0.4.3"
md-5 = "0.11.0"
sevenz-rust2 = "0.20.2"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
url = "2.5.8"
zax-platform.workspace = true
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
