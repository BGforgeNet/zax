# Packs a mod's payload into an archive ZAX can install, on a version tag. Attaching it to the release is the
# caller's step - every repository already has its own way of doing that, and an action that also published
# would fight it.
#
# Nothing here stamps the manifest: ZAX takes the version from the tag and the payload from the release's sole
# archive asset, so `f2mod.yml` is committed once and never touched again.
#
# Inputs reach the script through `env` rather than `${{ }}` interpolation, so a value can never be read as
# shell. The checkout is the caller's too, so a mod that builds its files can run its build first.

name: Pack a ZAX mod
description: Packs a mod's payload into a release archive on a version tag, for a repository carrying an f2mod.yml.

inputs:
  paths:
    description: What goes into the archive, one path per line, relative to `directory`.
    default: mods
  directory:
    description: The directory those paths are relative to. `mods/` must end up at the archive's root.
    default: "."
  name:
    description: The archive's base name. Defaults to the repository's own name.
    default: ""

outputs:
  archive:
    description: The archive's name, written in the workspace and ready to attach to the release.
    value: ${{ steps.pack.outputs.archive }}
  version:
    description: The version ZAX will read from the tag.
    value: ${{ steps.pack.outputs.version }}

runs:
  using: composite
  steps:
    - name: Pack the payload
      id: pack
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        DIRECTORY: ${{ inputs.directory }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail

        if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
          echo "This action packs a tag's release; it ran on ${GITHUB_REF_TYPE:-nothing}." >&2
          exit 1
        fi
        version="${GITHUB_REF_NAME#v}"
        # ZAX passes over a tag whose version does not start with a digit, so a release built from one would
        # be published and never offered. Refusing here is the difference between a red run and a silent miss.
        case "$version" in
          [0-9]*) ;;
          *)
            echo "The tag \"$GITHUB_REF_NAME\" names no version - ZAX reads v14.7 as 14.7 and ignores the rest." >&2
            exit 1
            ;;
        esac

        if [ ! -f f2mod.yml ]; then
          echo "No f2mod.yml at the repository root, which is where ZAX reads it for the tag." >&2
          exit 1
        fi

        cd "$DIRECTORY"
        if [ ! -d mods ] || [ -z "$(find mods -type f -print -quit)" ]; then
          echo "Nothing under mods/ in \"$DIRECTORY\" - a payload with no mods/ installs nothing." >&2
          exit 1
        fi

        # `<name>_<tag>.zip`, the tag whole rather than the version - the naming Fallout 2 mod releases
        # already use, and what a person scanning a releases page expects to see.
        name="${NAME:-${GITHUB_REPOSITORY##*/}}"
        archive="${name}_${GITHUB_REF_NAME}.zip"
        # Removed first: zip ADDS to an archive that already exists, so a build that packed one under this
        # name - or a re-run - would ship its entries merged with these rather than replaced.
        rm -f "$archive"
        # -X drops the extra file attributes, which are per-machine and would change the archive's digest
        # between two builds of identical content.
        # shellcheck disable=SC2086
        zip -rXq "$archive" $PATHS

        # Only when it was built somewhere else: with the default directory the archive is already there, and
        # moving a file onto itself is an error rather than a no-op.
        if [ "$(pwd -P)" != "$(cd "$GITHUB_WORKSPACE" && pwd -P)" ]; then
          mv "$archive" "$GITHUB_WORKSPACE/$archive"
        fi
        echo "archive=$archive" >>"$GITHUB_OUTPUT"
        echo "version=$version" >>"$GITHUB_OUTPUT"
