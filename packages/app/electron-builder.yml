# What a distributable copy of ZAX is made of.
#
# Every target here is portable: there is no installer, because there is nothing to install. ZAX has no file
# associations, no protocol handler, no service and nothing needing administrator rights - it edits files in a
# game folder the user points it at. An installer would buy a start menu entry and an uninstall record, and cost
# a privileged step and a machine the user cannot carry on a stick.

appId: net.bgforge.zax
productName: ZAX
# Without this the binary is named after the package - `@zax/app` sanitised into `@zaxapp`, which is what a user
# would see in a process list and on a launcher.
executableName: zax

directories:
  buildResources: build
  output: release

# An include pattern replaces the default rather than adding to it, so this is the whole list. `package.json` and
# the production dependency graph are included regardless - which is why the workspace packages sit in
# devDependencies: esbuild bundles them into `dist`, and as production dependencies they would ship a second,
# dead copy of their TypeScript sources.
files:
  - dist/**
  - package.json

# Both of these are reached by path at runtime rather than imported, and a path inside the archive is not a path
# the operating system can open: the worker is started with `new Worker(url)`, and 7z-wasm loads its `.wasm` from
# beside its own module. Left packed, both fail only when a user first extracts an archive.
asarUnpack:
  - "**/node_modules/7z-wasm/**"
  - "**/extract-worker.cjs"
  - "**/zip-worker.cjs"

# Nothing here is a native module - the one piece of native code is WebAssembly, which needs no rebuild.
npmRebuild: false

# Electron ships these on, which leaves every copy of ZAX usable as a general Node interpreter and as a
# debugger target: `ELECTRON_RUN_AS_NODE=1 zax script.js` runs the script, and `--inspect` attaches. That
# matters more here than for most applications, because every target is portable and unsigned - a copy sits in
# a directory the user can write to, under a name their machine already trusts.
#
# None of the three costs anything to give up: the workers are `worker_threads`, not `process.fork`, which is
# the one thing disabling `runAsNode` breaks.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Electron otherwise searches `app.asar` then `app/` then `default_app.asar`, so a directory dropped beside
  # the archive is loaded in preference to nothing. One entry means the archive or nothing.
  onlyLoadAppFromAsar: true
  # Left off deliberately, not overlooked. It is what would make the archive tamper-evident rather than merely
  # canonical, but it validates against hashes bound to a signature, and this application is not signed. It
  # becomes worth turning on with code signing, not before.
  enableEmbeddedAsarIntegrityValidation: false
# `grantFileProtocolExtraPrivileges` stays at its default: the packaged interface is loaded with `loadFile`,
# so it is a `file://` page, and revoking those privileges is a change to how it loads rather than a setting.

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  # `zip` is the one that genuinely runs in place; `portable` is a single executable that unpacks itself into a
  # temporary directory on first launch, which is as close to one file as an application carrying Chromium gets.
  target:
    - zip
    - portable

portable:
  # Keyed to the version rather than to each launch, so a copy unpacks once and starts immediately after that.
  unpackDirName: ZAX-${version}
  requestExecutionLevel: user

linux:
  # An AppImage is the only genuinely single file of the three: the kernel mounts it in place rather than
  # unpacking it anywhere.
  target:
    - AppImage
    - tar.gz
  category: Utility
  synopsis: Configuration and mod manager for Fallout 2
  # Names the installed entry after `desktopName` in package.json, which is also what Electron reports as its
  # app_id - a desktop that cannot match the two shows a running window as a second, unnamed application. This
  # becomes the default in electron-builder 27.
  syncDesktopName: true

mac:
  target:
    - zip
  category: public.app-category.utilities
