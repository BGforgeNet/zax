# Followed mod source. See crates/indexer/src/source.rs for the format.
id: rpu24
repository: BGforgeNet/Fallout2_Restoration_Project
repository-id: 193099881
name: RPU 2.4
base: true
line:
  prefix: "2.4."
  counter: false
companions: [_translations.zip]
# RPU's own shipped order (release/mods_order.txt in the repository), earliest-loading first: a mod
# further down overrides one above it. Not a list of RPU's own files - rpu.dat and the rpu_* lines are
# RPU, the rest are separate mods whose place RPU states. Both RPU lines become fallout2rpu, so the
# order is stated once, here.
order:
  game: fallout2rpu
  entries:
    - rpu.dat
    - party_orders.dat
    - npc_armor.dat
    - rpu_czech.dat
    - rpu_french.dat
    - rpu_german.dat
    - rpu_hungarian.dat
    - rpu_italian.dat
    - rpu_polish.dat
    - rpu_portuguese.dat
    - rpu_russian.dat
    - upu_russian_sound.dat
    - rpu_spanish.dat
    - rpu_enhanced_worldmap.dat
    - rpu_extended_flamer.dat
    - rpu_rifle_animations.dat
    - rpu_wakizashi_animations.dat
    - cassidy_head.dat
    - cassidy_voice_joey_bracken_hq.dat
    - rpu_improved_mysterious_stranger.dat
    - walk_speed_fix_low_fps.dat
    - goris_fast_derobing_low_fps.dat
    - fo2tweaks.dat
    - InventoryFilter.dat
document: |
  spec: 1
  id: rpu24
  name: Restoration Project Updated 2.4
  game: fallout2
  type: base
  becomes: fallout2rpu
  installer.windows.built-with: inno
  installer.other.run: rpu-install.sh
  settings:
    main.marcus_armor:
      file: mods/rpu.ini
      kind: bool
      default: 1
      label: Mutant armor for Marcus
    main.dogmeat_armor:
      file: mods/rpu.ini
      kind: bool
      default: 1
      label: Kevlar armor for Dogmeat
    main.smoking:
      file: mods/rpu.ini
      kind: bool
      default: 1
      label: Smoking animation
      help: The player character's smoking animation.
    main.lenny_new_look:
      file: mods/rpu.ini
      kind: bool
      default: 1
      label: New look for Lenny
      help: Gives Lenny a different ghoul sprite.
    main.vault_boxer:
      file: mods/rpu.ini
      kind: bool
      default: 1
      label: Vault boxer in the ring
      help: Use the unique vault boxer model when fighting in the ring.
    main.goris_derobing_speed:
      file: mods/upu.ini
      kind: int
      min: 16
      max: 100
      unit: fps
      sentinels: { 0: "Off" }
      default: 50
      label: Goris de-robing speed
      help: How fast Goris takes off his robe. The original game plays it at 16. No effect if the alternative low FPS Goris de-robing is installed.
    main.critters_walk_faster:
      file: mods/upu.ini
      kind: bool
      default: 1
      label: Faster walking for slow critters
      help: Robots, various guards and a few other critters walk much slower than everyone else; this speeds them up a little. Cosmetic only. No effect if the alternative low FPS walk speed fix is installed.
    main.wipe_inventory:
      file: mods/upu.ini
      kind: bool
      default: 0
      label: Fresh merchant stock on each restock
      help: Off, merchants keep every item you ever sold them, on top of their restocks. On, each restock gives them fresh inventory. Quest items are always kept. Can be changed mid-game.
    ncr.repeatable_brahmin_drive:
      file: mods/upu.ini
      kind: bool
      default: 1
      label: Repeatable NCR brahmin drive
      help: The NCR to Redding brahmin drive can be done again, as Duppo says. The drives end if Hal dies.
